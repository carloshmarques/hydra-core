  <text x="912" y="608" font-family="Segoe UI, sans-serif" font-size="14" fill="#F8FAFC">Pausa ativa recomendada: alonga os</text>
  <text x="912" y="630" font-family="Segoe UI, sans-serif" font-size="14" fill="#F8FAFC">ombros, hidrata-te e descansa a vista</text>
  <text x="912" y="652" font-family="Segoe UI, sans-serif" font-size="14" fill="#F8FAFC">longe do ecrã após 90 min de código.</text>
